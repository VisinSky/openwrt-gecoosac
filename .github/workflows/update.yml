name: 自动同步上游仓库更新

on:
  schedule:
    - cron: '0 0 * * 0'  # 每周日UTC零点执行
  workflow_dispatch:     # 允许手动触发

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 授予写入仓库内容的权限
      repository-projects: write  # 授予触发repository_dispatch的权限

    steps:
      # 步骤1：检出你fork的仓库代码
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取所有历史，确保能合并上游
          persist-credentials: false  # 推荐保留，避免凭据冲突

      # 步骤2：配置git用户信息（引用Secrets变量，无明文暴露）
      - name: 配置git用户信息
        run: |
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"

      # 步骤3：添加上游仓库地址并拉取更新
      - name: 拉取上游仓库更新
        run: |
          UPSTREAM_REPO="https://github.com/lwb1978/openwrt-gecoosac.git"  # 替换为原仓库地址
          UPSTREAM_BRANCH="main"  # 替换为原仓库主分支
          
          git remote add upstream $UPSTREAM_REPO || git remote set-url upstream $UPSTREAM_REPO
          git fetch upstream
          
          git checkout main
          git merge upstream/$UPSTREAM_BRANCH --ff-only

      # 步骤4：推送同步后的代码（核心修改：精准指定推送分支，避免名称冲突）
      - name: 推送同步后的代码
        run: |
          # 配置git远程仓库地址（带token认证）
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          # 明确推送refs/heads/main（分支），而非仅main（会匹配分支+标签）
          git push origin refs/heads/main:refs/heads/main

      # 步骤5：触发编译工作流（保持不变）
      - name: 触发自动编译工作流
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: upstream_synced
          repository: ${{ github.repository }}

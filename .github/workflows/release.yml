name: 自动编译发布

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '选择要编译的架构'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'aarch64_cortex-a53'
          - 'aarch64_cortex-a72'
          - 'aarch64_generic'
          - 'arm_arm1176jzf-s_vfp'
          - 'arm_arm926ej-s'
          - 'arm_cortex-a15_neon-vfpv4'
          - 'arm_cortex-a5_vfpv4'
          - 'arm_cortex-a7'
          - 'arm_cortex-a7_neon-vfpv4'
          - 'arm_cortex-a8_vfpv3'
          - 'arm_cortex-a9'
          - 'arm_cortex-a9_neon'
          - 'arm_cortex-a9_vfpv3-d16'
          - 'arm_fa526'
          - 'arm_mpcore'
          - 'arm_xscale'
          - 'i386_pentium-mmx'
          - 'i386_pentium4'
          - 'mips64_octeonplus'
          - 'mips_24kc'
          - 'mips_4kec'
          - 'mips_mips32'
          - 'mipsel_24kc'
          - 'mipsel_24kc_24kf'
          - 'mipsel_74kc'
          - 'mipsel_mips32'
          - 'x86_64'
  repository_dispatch:
    types: [upstream_synced]

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_mpcore
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Building packages
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      # 新增：创建统一目录，将当前架构的产物复制进去
      - name: 整理多架构产物到统一目录
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        run: |
          # 创建统一目录（all-archs），子目录为架构名
          mkdir -p bin/all-archs/${{ matrix.arch }}
          # 复制ipk和Packages.gz到统一目录
          cp bin/packages/${{ matrix.arch }}/packages_ci/*.ipk bin/all-archs/${{ matrix.arch }}/
          cp bin/packages/${{ matrix.arch }}/packages_ci/Packages.gz bin/all-archs/${{ matrix.arch }}/

      # 上传整理后的产物（统一目录）
      - name: Upload artifacts
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: actions/upload-artifact@v4
        with:
          name: all-archs-${{ matrix.arch }}
          path: bin/all-archs/

      # 发布统一目录的所有产物到Release
      - name: 发布多架构产物到Release
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Auto Build (Upstream Synced)' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          # 上传统一目录下的所有架构产物
          artifacts: "bin/all-archs/**/*"
          # 统一Tag，方便opkg源指向
          tag: gecoosac-auto-update
          body: |
            支持架构：${{ matrix.arch }}
            触发方式：
            ${{ 
              github.event_name == 'workflow_dispatch' && '手动触发' ||
              github.event_name == 'push' && '标签推送' ||
              github.event_name == 'repository_dispatch' && '上游仓库同步后自动触发'
            }}

name: Build packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:  # 手动触发事件
    inputs:
      arch:
        description: '指定要编译的架构（留空则编译所有架构）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Building packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      # 核心新增：利用SDK内置的ipkg-make-index生成opkg索引（无外部下载）
      - name: Generate opkg index files (use SDK built-in tool)
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 进入ipk所在目录（原始代码的输出路径）
          cd bin/packages/${{ matrix.arch }}/packages_ci/
          # 利用SDK内置的ipkg-make-index生成索引（原始环境已自带，无需下载）
          ipkg-make-index . > Packages
          # 生成压缩版索引（opkg优先读取）
          gzip -c Packages > Packages.gz
          # 生成校验和（可选，增强安全性）
          sha256sum *.ipk Packages Packages.gz > Checksums

      - name: Upload artifacts
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          # 上传时包含索引文件（Packages、Packages.gz、Checksums）
          path: |
            bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
            bin/packages/${{ matrix.arch }}/packages_ci/Packages*
            bin/packages/${{ matrix.arch }}/packages_ci/Checksums

      - name: Upload packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          # 发布时包含索引文件
          artifacts: |
            bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
            bin/packages/${{ matrix.arch }}/packages_ci/Packages*
            bin/packages/${{ matrix.arch }}/packages_ci/Checksums
          tag: ${{ github.ref_name || 'manual-build' }}

  # 新增：汇总所有架构文件，部署到GitHub Pages实现统一opkg源地址
  deploy-unified-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./opkg-unified-repo
          merge-multiple: true

      - name: Deploy to GitHub Pages (unified opkg repo)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./opkg-unified-repo
          publish_branch: gh-pages
          force_orphan: true

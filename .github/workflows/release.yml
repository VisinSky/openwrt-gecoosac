name:编译发布

# 触发规则：
# 1. 标签推送（v* 标签）：自动编译所有架构
# 2. 手动触发：支持选择指定架构或全部架构
# 3. 上游同步后触发（repository_dispatch）：自动编译所有架构
on:
  push:
    tags:
      - v*
  workflow_dispatch:  # 手动触发事件
    inputs:
      arch:
        description: '选择要编译的架构'
        required: true
        type: choice  # 下拉列表类型
        default: 'all'  # 默认选“全部架构”
        options:  # 下拉列表选项（与矩阵架构一致）
          - 'all'
          - 'aarch64_cortex-a53'
          - 'aarch64_cortex-a72'
          - 'aarch64_generic'
          - 'arm_arm1176jzf-s_vfp'
          - 'arm_arm926ej-s'
          - 'arm_cortex-a15_neon-vfpv4'
          - 'arm_cortex-a5_vfpv4'
          - 'arm_cortex-a7'
          - 'arm_cortex-a7_neon-vfpv4'
          - 'arm_cortex-a8_vfpv3'
          - 'arm_cortex-a9'
          - 'arm_cortex-a9_neon'
          - 'arm_cortex-a9_vfpv3-d16'
          - 'arm_fa526'
          - 'arm_mpcore'
          - 'arm_xscale'
          - 'i386_pentium-mmx'
          - 'i386_pentium4'
          - 'mips64_octeonplus'
          - 'mips_24kc'
          - 'mips_4kec'
          - 'mips_mips32'
          - 'mipsel_24kc'
          - 'mipsel_24kc_24kf'
          - 'mipsel_74kc'
          - 'mipsel_mips32'
          - 'x86_64'
  repository_dispatch:  # 上游同步后触发（与sync-upstream.yml的event-type匹配）
    types: [upstream_synced]

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 一个架构编译失败不影响其他架构
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_mpcore
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，确保编译环境完整

      # 核心逻辑：根据触发方式判断编译架构
      - name: Building packages
        # 触发条件：
        # 1. 手动触发：选all则编译所有架构，否则只编译选中的架构
        # 2. 标签推送/上游同步触发：默认编译所有架构
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10  # 对应OpenWrt 24.10 SDK架构
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac  # 要编译的插件名
          NO_REFRESH_CHECK: true

      # 上传编译产物到Action临时产物
      - name: Upload artifacts
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk

      # 将编译产物发布到GitHub Release
      - name: Upload packages to Release
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: ncipollo/release-action@v1
        with:
          # 发布名称：标签触发用标签名，手动/同步触发用“Manual Build”
          name: ${{ github.ref_name || 'Auto Build (Upstream Synced)' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true  # 允许更新已存在的Release
          replacesArtifacts: true  # 替换已存在的产物
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.ipk"
          # 标签：标签触发用标签名，手动/同步触发用固定标签（避免冲突）
          tag: ${{ github.ref_name || 'auto-build-upstream-synced' }}
          body: |
            编译架构：${{ matrix.arch }}
            触发方式：
            ${{ 
              github.event_name == 'workflow_dispatch' && '手动触发' ||
              github.event_name == 'push' && '标签推送' ||
              github.event_name == 'repository_dispatch' && '上游仓库同步后自动触发'
            }}

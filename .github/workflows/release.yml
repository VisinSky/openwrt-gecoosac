name: 自动编译发布

# 触发规则：标签推送 + 手动触发 + 上游同步后触发
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '选择要编译的架构'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'aarch64_cortex-a53'
          - 'aarch64_cortex-a72'
          - 'aarch64_generic'
          - 'arm_arm1176jzf-s_vfp'
          - 'arm_arm926ej-s'
          - 'arm_cortex-a15_neon-vfpv4'
          - 'arm_cortex-a5_vfpv4'
          - 'arm_cortex-a7'
          - 'arm_cortex-a7_neon-vfpv4'
          - 'arm_cortex-a8_vfpv3'
          - 'arm_cortex-a9'
          - 'arm_cortex-a9_neon'
          - 'arm_cortex-a9_vfpv3-d16'
          - 'arm_fa526'
          - 'arm_mpcore'
          - 'arm_xscale'
          - 'i386_pentium-mmx'
          - 'i386_pentium4'
          - 'mips64_octeonplus'
          - 'mips_24kc'
          - 'mips_4kec'
          - 'mips_mips32'
          - 'mipsel_24kc'
          - 'mipsel_24kc_24kf'
          - 'mipsel_74kc'
          - 'mipsel_mips32'
          - 'x86_64'
  repository_dispatch:
    types: [upstream_synced]  # 与sync-upstream.yml的触发类型一致

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_mpcore
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 编译逻辑：适配不同触发方式
      - name: 编译OpenWrt插件
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      # 上传编译产物到Action临时存储
      - name: 上传编译产物
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.ipk

      # 发布编译产物到GitHub Release
      - name: 发布产物到Release
        if: >-
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.arch == 'all' || matrix.arch == github.event.inputs.arch)) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'repository_dispatch' && github.event.action == 'upstream_synced')
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Auto Build (Upstream Synced)' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*.ipk"
          tag: ${{ github.ref_name || 'auto-build-upstream-synced' }}
          body: |
            编译架构：${{ matrix.arch }}
            触发方式：
            ${{ 
              github.event_name == 'workflow_dispatch' && '手动触发' ||
              github.event_name == 'push' && '标签推送' ||
              github.event_name == 'repository_dispatch' && '上游仓库同步后自动触发'
            }}

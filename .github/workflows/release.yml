name: Build packages for unified opkg repo

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '指定要编译的架构（留空则编译所有架构）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Building packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      - name: Install basic dependencies
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y perl wget  # 仅需perl（脚本依赖）和wget（下载脚本）

      - name: Get ipkg-make-index script from OpenWRT source
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 从OpenWRT官方源码下载ipkg-make-index脚本（兼容所有版本）
          wget https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-make-index.pl -O /tmp/ipkg-make-index
          # 赋予执行权限
          chmod +x /tmp/ipkg-make-index
          # 将脚本加入PATH，方便调用
          export PATH=/tmp:$PATH

      - name: Create unified repo structure and generate opkg index
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 创建统一的opkg源根目录，按架构分文件夹
          mkdir -p ./opkg-repo/${{ matrix.arch }}
          # 复制编译好的ipk到对应架构目录
          cp bin/packages/${{ matrix.arch }}/packages_ci/*.ipk ./opkg-repo/${{ matrix.arch }}/ || echo "No IPK files found for ${{ matrix.arch }}"
          # 生成Packages索引文件（使用下载的脚本）
          cd ./opkg-repo/${{ matrix.arch }}
          if [ -n "$(ls *.ipk 2>/dev/null)" ]; then
            /tmp/ipkg-make-index . > Packages
            # 生成压缩版索引（opkg优先读取，节省流量）
            gzip -c Packages > Packages.gz
            # 生成校验和（可选，增强安全性）
            sha256sum *.ipk Packages Packages.gz > Checksums
          else
            echo "Skip index generation: No IPK files for ${{ matrix.arch }}"
          fi

      - name: Upload single arch artifacts
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: opkg-repo-${{ matrix.arch }}
          path: ./opkg-repo/${{ matrix.arch }}/

  # 新增汇总任务：合并所有架构的文件，发布到GitHub Pages（统一访问地址）
  deploy-repo:
    name: Deploy unified opkg repo to GitHub Pages
    needs: build  # 依赖build任务完成
    runs-on: ubuntu-latest
    steps:
      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./opkg-repo
          merge-multiple: true  # 合并所有架构的artifact到同一目录

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./opkg-repo  # 发布整个opkg-repo目录
          publish_branch: gh-pages  # 发布到gh-pages分支（GitHub Pages默认）
          force_orphan: true  # 清空旧分支内容，只保留最新的包

  # 可选：同步发布到Release（备用下载地址）
  release-repo:
    name: Release unified opkg repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./opkg-repo
          merge-multiple: true

      - name: Package repo for release
        run: |
          tar -zcvf opkg-repo.tar.gz ./opkg-repo

      - name: Upload to Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: ./opkg-repo.tar.gz
          tag: ${{ github.ref_name || 'manual-build' }}

name: Build OpenWrt Packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '指定要编译的架构（留空则编译所有架构）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      - name: Generate Packages index
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          PACKAGE_DIR="bin/packages/${{ matrix.arch }}/packages_ci"
          if [ ! -d "$PACKAGE_DIR" ]; then
            echo "错误：编译产物目录不存在，跳过索引生成"
            exit 0
          fi
          cd "$PACKAGE_DIR"
          
          # 定义变量避免YAML解析冲突
          MATRIX_ARCH="${{ matrix.arch }}"
          GITHUB_REF_NAME="${{ github.ref_name || 'latest' }}"
          REPOSITORY_OWNER="${{ github.repository_owner }}"
          REPOSITORY_NAME="${{ github.event.repository.name }}"
          
          # 逐行生成Python脚本（无三重引号、无特殊字符冲突）
          echo "import os" > generate_packages.py
          echo "import gzip" >> generate_packages.py
          echo "import hashlib" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "def generate_packages_index():" >> generate_packages.py
          echo "    packages = []" >> generate_packages.py
          echo "    arch = \"$MATRIX_ARCH\"" >> generate_packages.py
          echo "    release_name = \"$GITHUB_REF_NAME\"" >> generate_packages.py
          echo "    repo_owner = \"$REPOSITORY_OWNER\"" >> generate_packages.py
          echo "    repo_name = \"$REPOSITORY_NAME\"" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "    for filename in os.listdir(\".\"):" >> generate_packages.py
          echo "        if not filename.endswith(\".ipk\"):" >> generate_packages.py
          echo "            continue" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "        with open(filename, \"rb\") as f:" >> generate_packages.py
          echo "            content = f.read()" >> generate_packages.py
          echo "            file_size_bytes = len(content)" >> generate_packages.py
          echo "            file_size_kb = file_size_bytes // 1024" >> generate_packages.py
          echo "            md5_hash = hashlib.md5(content).hexdigest()" >> generate_packages.py
          echo "            sha256_hash = hashlib.sha256(content).hexdigest()" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "        basename = filename[:-4]" >> generate_packages.py
          echo "        parts = basename.split(\"_\")" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "        if len(parts) >= 3:" >> generate_packages.py
          echo "            package_name = \"_\".join(parts[:-2])" >> generate_packages.py
          echo "            version = parts[-2]" >> generate_packages.py
          echo "            architecture = parts[-1]" >> generate_packages.py
          echo "        else:" >> generate_packages.py
          echo "            package_name = basename" >> generate_packages.py
          echo "            version = \"1.0-1\"" >> generate_packages.py
          echo "            architecture = arch" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "        if release_name != \"latest\":" >> generate_packages.py
          echo "            download_url = f\"https://github.com/{repo_owner}/{repo_name}/releases/download/{release_name}/{arch}/{filename}\"" >> generate_packages.py
          echo "        else:" >> generate_packages.py
          echo "            download_url = f\"https://github.com/{repo_owner}/{repo_name}/releases/latest/download/{arch}/{filename}\"" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "        package_info = \"Package: \" + package_name + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Version: \" + version + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Depends: libc\\n\"" >> generate_packages.py
          echo "        package_info += \"Source: \" + repo_name + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"SourceName: \" + package_name + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Section: luci\\n\"" >> generate_packages.py
          echo "        package_info += \"Architecture: \" + architecture + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Installed-Size: \" + str(file_size_kb) + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Filename: \" + arch + \"/\" + filename + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Size: \" + str(file_size_bytes) + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"MD5Sum: \" + md5_hash + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"SHA256sum: \" + sha256_hash + \"\\n\"" >> generate_packages.py
          echo "        package_info += \"Description: \" + package_name + \" - OpenWrt package\\n\"" >> generate_packages.py
          echo "        package_info += \"License: Unknown\\n\"" >> generate_packages.py
          echo "        package_info += \"Maintainer: Auto Build <auto@build.com>\\n\\n\"" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "        packages.append(package_info)" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "    with open(\"Packages\", \"w\") as f:" >> generate_packages.py
          echo "        for pkg in packages:" >> generate_packages.py
          echo "            f.write(pkg)" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "    with open(\"Packages\", \"rb\") as f_in:" >> generate_packages.py
          echo "        with gzip.open(\"Packages.gz\", \"wb\", compresslevel=9) as f_out:" >> generate_packages.py
          echo "            f_out.write(f_in.read())" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "    print(f\"Generated Packages index with {len(packages)} packages\")" >> generate_packages.py
          echo "" >> generate_packages.py
          echo "if __name__ == \"__main__\":" >> generate_packages.py
          echo "    generate_packages_index()" >> generate_packages.py
          
          python3 generate_packages.py
          rm generate_packages.py

      - name: Upload to artifacts
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/packages_ci/
          retention-days: 7

      - name: Prepare Release files
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          mkdir -p release/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/packages_ci/* release/${{ matrix.arch }}/

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false
          artifacts: release/${{ matrix.arch }}/*
          tag: ${{ github.ref_name || 'manual-build' }}
          omitBodyDuringUpdate: true

  # --------------- create-instructions 任务（完全修复缩进/语法）---------------
  create-instructions:
    name: Create Usage Instructions
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result != 'cancelled' }}
    steps:
      - name: Create usage instructions
        run: |
          mkdir -p instructions
          TAG_NAME="${{ github.ref_name || 'manual-build' }}"
          REPO="${{ github.repository }}"
          
          # 生成README.md（EOF严格顶格，无特殊字符）
          cat > instructions/README.md <<EOF
# OpenWrt 软件包仓库
本仓库提供 OpenWrt 软件包的自动构建和发布。

## 支持的架构
- aarch64_cortex-a53
- aarch64_cortex-a72
- aarch64_generic
- arm_arm1176jzf-s_vfp
- arm_arm926ej-s
- arm_cortex-a15_neon-vfpv4
- arm_cortex-a5_vfpv4
- arm_cortex-a7
- arm_cortex-a7_neon-vfpv4
- arm_cortex-a8_vfpv3
- arm_cortex-a9
- arm_cortex-a9_neon
- arm_cortex-a9_vfpv3-d16
- arm_fa526
- arm_xscale
- i386_pentium-mmx
- i386_pentium4
- mips64_octeonplus
- mips_24kc
- mips_4kec
- mips_mips32
- mipsel_24kc_24kf
- mipsel_74kc
- mipsel_mips32
- x86_64

## 使用方法
### 方法一：通过 opkg 源安装（推荐）
1. 查看路由器架构：
\`\`\`bash
ARCH=\$(opkg print-architecture | grep 'arch' | awk '{print \$2}')
echo "你的路由器架构：\$ARCH"
\`\`\`

2. 添加对应架构的软件源：
\`\`\`bash
echo "src/gz myrepo https://github.com/${REPO}/releases/download/${TAG_NAME}/\$ARCH" >> /etc/opkg/customfeeds.conf
\`\`\`

3. 更新软件源并安装：
\`\`\`bash
opkg update
opkg install luci-app-gecoosac
\`\`\`

### 方法二：手动安装
1. 从 Release 页面下载对应架构目录下的 .ipk 文件
2. 通过 SSH 上传到路由器
3. 安装：
\`\`\`bash
opkg install /path/to/luci-app-gecoosac_*.ipk
\`\`\`

## 常见问题
### 1. 如何确定路由器的架构？
\`\`\`bash
opkg print-architecture
\`\`\`

### 2. 如果遇到证书错误
\`\`\`bash
opkg install ca-bundle
\`\`\`

### 3. 无法访问 GitHub？
- 使用代理转发路由器网络
- 手动下载IPK文件上传安装

### 4. 更新软件
\`\`\`bash
opkg update
opkg upgrade luci-app-gecoosac
\`\`\`

## 开发说明
推送v*标签或手动触发Workflow可自动构建所有/指定架构包。
EOF
          
          # 生成安装脚本（EOF严格顶格）
          cat > instructions/INSTALL.sh <<EOF
#!/bin/sh
set -e
echo "=== 自动安装 luci-app-gecoosac ==="
# 检测架构
ARCH=\$(opkg print-architecture | grep -m1 'arch' | awk '{print \$2}')
if [ -z "\$ARCH" ]; then
  echo "错误：无法检测路由器架构！"
  exit 1
fi
echo "检测到架构：\$ARCH"
# 添加源
FEED_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/\$ARCH"
echo "添加软件源：\$FEED_URL"
echo "src/gz custom \$FEED_URL" >> /etc/opkg/customfeeds.conf
# 安装
opkg update && opkg install luci-app-gecoosac
echo "=== 安装完成 ==="
EOF
          
          chmod +x instructions/INSTALL.sh

      - name: Upload instructions to Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false
          artifacts: instructions/*
          tag: ${{ github.ref_name || 'manual-build' }}
          omitBodyDuringUpdate: true

name: Build packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '指定要编译的架构（留空则编译所有架构）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64_generic]  # 你可以恢复完整的架构列表

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Building packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      - name: Generate Packages index with GitHub URLs
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 进入包目录
          cd bin/packages/${{ matrix.arch }}/packages_ci
          
          # 确定 Release 名称（标签或手动构建）
          RELEASE_NAME="${{ github.ref_name || 'manual-build' }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          
          echo "Generating Packages index for GitHub release: $RELEASE_NAME"
          
          # 生成包含GitHub下载链接的Packages文件
          python3 << 'EOF'
import os
import gzip
import hashlib
import json

arch = "${{ matrix.arch }}"
release_name = "${{ github.ref_name || 'manual-build' }}"
repo_owner = "${{ github.repository_owner }}"
repo_name = "${{ github.event.repository.name }}"
repo_url = f"https://github.com/{repo_owner}/{repo_name}"

packages = []
for file in os.listdir('.'):
    if file.endswith('.ipk'):
        # 读取文件内容用于计算hash
        with open(file, 'rb') as f:
            data = f.read()
            file_size = len(data)
            md5sum = hashlib.md5(data).hexdigest()
            sha256sum = hashlib.sha256(data).hexdigest()
        
        # 解析文件名获取包信息
        # 格式示例: luci-app-gecoosac_1.0-1_all.ipk
        basename = file[:-4]  # 去掉.ipk后缀
        parts = basename.split('_')
        
        if len(parts) >= 3:
            pkg_name = parts[0]
            version = parts[1]
            # 架构信息可能在第二部分或第三部分
            if len(parts) == 3:
                architecture = parts[2]
            else:
                # 处理类似 luci-app-gecoosac_1.0-1_all_other.ipk 的情况
                architecture = parts[2] if parts[2] != 'all' else parts[3] if len(parts) > 3 else 'all'
        else:
            # 如果解析失败，使用默认值
            pkg_name = basename
            version = '1.0'
            architecture = arch
        
        # GitHub下载链接（使用Release中的文件）
        # GitHub Releases文件的下载链接格式：https://github.com/user/repo/releases/download/tag/filename
        download_url = f"{repo_url}/releases/download/{release_name}/{file}"
        
        # 构建包描述信息
        package_info = f"""Package: {pkg_name}
Version: {version}
Architecture: {architecture}
Filename: {file}
Size: {file_size}
MD5Sum: {md5sum}
SHA256sum: {sha256sum}
Description: Auto-generated package for {arch}
Depends: 
License: Unknown
Source: {repo_url}
SourceName: {pkg_name}
Section: luci
Maintainer: Auto Build
Url: {repo_url}

"""
        packages.append(package_info)

# 写入Packages文件
with open('Packages', 'w') as f:
    f.write('\n'.join(packages))

# 创建压缩版本
with open('Packages', 'rb') as f_in:
    with gzip.open('Packages.gz', 'wb', compresslevel=9) as f_out:
        f_out.write(f_in.read())

print(f"Generated Packages index for {arch}")
print(f"Repository URL: {repo_url}/releases/download/{release_name}/")
EOF

      - name: Create README for GitHub source
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          cd bin/packages/${{ matrix.arch }}/packages_ci
          
          cat > README.md << EOF
          # OpenWrt Packages for ${{ matrix.arch }}
          
          This directory contains OpenWrt packages built for ${{ matrix.arch }} architecture.
          
          ## How to use as opkg source
          
          Add the following line to your OpenWrt router's \`/etc/opkg/customfeeds.conf\`:
          
          \`\`\`
          src/gz custom https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/${{ github.ref_name || 'manual-build' }}
          \`\`\`
          
          Or add it to \`/etc/opkg/distfeeds.conf\`:
          
          \`\`\`
          src/gz custom https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/${{ github.ref_name || 'manual-build' }}/${{ matrix.arch }}
          \`\`\`
          
          Then update and install:
          
          \`\`\`
          opkg update
          opkg install luci-app-gecoosac
          \`\`\`
          
          ## Manual installation
          
          You can also manually install the .ipk files:
          
          \`\`\`
          opkg install luci-app-gecoosac_*.ipk
          \`\`\`
          
          ## File list
          
          $(ls -la *.ipk | awk '{print $9, "(" $5 " bytes)"}')
          EOF

      - name: Upload artifacts
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*

      - name: Upload packages to Release (All files)
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          # 上传所有文件，包括 .ipk, Packages, Packages.gz, README.md
          artifacts: "bin/packages/${{ matrix.arch }}/packages_ci/*"
          tag: ${{ github.ref_name || 'manual-build' }}
          
      - name: Create combined release structure
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 创建包含所有架构的统一目录
          mkdir -p combined_release/
          
          # 复制当前架构的文件到子目录
          cp -r bin/packages/${{ matrix.arch }}/packages_ci/* combined_release/
          
          # 创建使用说明文件
          cat > combined_release/USAGE.md << EOF
          # OpenWrt Packages Repository
          
          ## Available architectures:
          - ${{ matrix.arch }}
          
          ## Usage:
          
          1. **Method 1: Direct GitHub URL** (recommended)
          
          Add to \`/etc/opkg/customfeeds.conf\`:
          
          \`\`\`
          src/gz custom https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/${{ github.ref_name || 'manual-build' }}
          \`\`\`
          
          2. **Method 2: Architecture-specific URL**
          
          For ${{ matrix.arch }} only:
          
          \`\`\`
          src/gz custom https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/${{ github.ref_name || 'manual-build' }}/${{ matrix.arch }}
          \`\`\`
          
          3. **Update and install:**
          
          \`\`\`
          opkg update
          opkg install luci-app-gecoosac
          \`\`\`
          
          ## Notes:
          - Make sure your router can access GitHub
          - Some routers may need to install \`ca-bundle\` or \`ca-certificates\` for HTTPS
          - If HTTPS fails, try HTTP (not recommended for security):
          \`\`\`
          src/gz custom http://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/releases/download/${{ github.ref_name || 'manual-build' }}
          \`\`\`
          EOF

      - name: Upload combined release
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false  # 不覆盖之前的文件
          artifacts: "combined_release/*"
          tag: ${{ github.ref_name || 'manual-build' }}

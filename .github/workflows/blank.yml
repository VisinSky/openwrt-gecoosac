name: Build OpenWrt Packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '指定要编译的架构（留空则编译所有架构）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      - name: Generate Packages index
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 检查目录是否存在，避免cd失败
          PACKAGE_DIR="bin/packages/${{ matrix.arch }}/packages_ci"
          if [ ! -d "$PACKAGE_DIR" ]; then
            echo "错误：编译产物目录不存在，跳过索引生成"
            exit 0
          fi
          
          cd "$PACKAGE_DIR"
          
          # 定义变量避免YAML解析冲突
          MATRIX_ARCH="${{ matrix.arch }}"
          GITHUB_REF_NAME="${{ github.ref_name || 'latest' }}"
          REPOSITORY_OWNER="${{ github.repository_owner }}"
          REPOSITORY_NAME="${{ github.event.repository.name }}"
          
          # 创建Python脚本生成索引（完全避免在YAML中嵌入${{ }}）
          cat > generate_packages.py << EOF
import os
import gzip
import hashlib

def generate_packages_index():
    packages = []
    arch = "$MATRIX_ARCH"
    release_name = "$GITHUB_REF_NAME"
    repo_owner = "$REPOSITORY_OWNER"
    repo_name = "$REPOSITORY_NAME"

    for filename in os.listdir("."):
        if not filename.endswith(".ipk"):
            continue

        with open(filename, "rb") as f:
            content = f.read()
            file_size_bytes = len(content)
            file_size_kb = file_size_bytes // 1024  # OpenWrt规范：Installed-Size用KB
            md5_hash = hashlib.md5(content).hexdigest()
            sha256_hash = hashlib.sha256(content).hexdigest()

        basename = filename[:-4]
        parts = basename.split("_")

        if len(parts) >= 3:
            package_name = "_".join(parts[:-2])
            version = parts[-2]
            architecture = parts[-1]
        else:
            package_name = basename
            version = "1.0-1"
            architecture = arch  # 使用完整架构名

        # 修正下载URL（包含架构路径）
        if release_name != "latest":
            download_url = f"https://github.com/{repo_owner}/{repo_name}/releases/download/{release_name}/{arch}/{filename}"
        else:
            download_url = f"https://github.com/{repo_owner}/{repo_name}/releases/latest/download/{arch}/{filename}"

        package_info = f"""Package: {package_name}
Version: {version}
Depends: libc
Source: {repo_name}
SourceName: {package_name}
Section: luci
Architecture: {architecture}
Installed-Size: {file_size_kb}
Filename: {arch}/{filename}
Size: {file_size_bytes}
MD5Sum: {md5_hash}
SHA256sum: {sha256_hash}
Description: {package_name} - OpenWrt package
License: Unknown
Maintainer: Auto Build <auto@build.com>

"""
        packages.append(package_info)

    with open("Packages", "w") as f:
        for pkg in packages:
            f.write(pkg)

    with open("Packages", "rb") as f_in:
        with gzip.open("Packages.gz", "wb", compresslevel=9) as f_out:
            f_out.write(f_in.read())

    print(f"Generated Packages index with {len(packages)} packages")

if __name__ == "__main__":
    generate_packages_index()
EOF
          
          python3 generate_packages.py
          rm generate_packages.py

      - name: Upload to artifacts
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/packages_ci/
          retention-days: 7

      - name: Prepare Release files (按架构分目录)
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          # 创建架构专属目录，避免文件覆盖
          mkdir -p release/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/packages_ci/* release/${{ matrix.arch }}/

      - name: Upload to GitHub Release (追加模式)
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false  # 改为追加模式，避免覆盖
          artifacts: release/${{ matrix.arch }}/*
          tag: ${{ github.ref_name || 'manual-build' }}
          omitBodyDuringUpdate: true  # 避免重复更新Release描述

  create-instructions:
    name: Create Usage Instructions
    runs-on: ubuntu-latest
    needs: build
    # 仅当build任务成功/部分成功时执行（跳过全失败场景）
    if: ${{ needs.build.result == 'success' || needs.build.result == 'skipped' || (needs.build.result == 'failure' && needs.build.result != 'cancelled') }}
    
    steps:
      - name: Create usage instructions
        run: |
          mkdir -p instructions
          
          # 定义变量避免YAML解析冲突
          TAG_NAME="${{ github.ref_name || 'manual-build' }}"
          REPO="${{ github.repository }}"
          
          # 生成README.md（修复opkg源URL）
          cat > instructions/README.md << EOF
# OpenWrt 软件包仓库
本仓库提供 OpenWrt 软件包的自动构建和发布。

## 支持的架构
- aarch64_cortex-a53
- aarch64_cortex-a72
- aarch64_generic
- arm_arm1176jzf-s_vfp
- arm_arm926ej-s
- arm_cortex-a15_neon-vfpv4
- arm_cortex-a5_vfpv4
- arm_cortex-a7
- arm_cortex-a7_neon-vfpv4
- arm_cortex-a8_vfpv3
- arm_cortex-a9
- arm_cortex-a9_neon
- arm_cortex-a9_vfpv3-d16
- arm_fa526
- arm_xscale
- i386_pentium-mmx
- i386_pentium4
- mips64_octeonplus
- mips_24kc
- mips_4kec
- mips_mips32
- mipsel_24kc_24kf
- mipsel_74kc
- mipsel_mips32
- x86_64

## 使用方法
### 方法一：通过 opkg 源安装（推荐）
1. 查看路由器架构：
\`\`\`bash
ARCH=\$(opkg print-architecture | grep 'arch' | awk '{print \$2}')
echo "你的路由器架构：\$ARCH"
\`\`\`

2. 添加对应架构的软件源：
\`\`\`bash
# 替换 \$ARCH 为实际架构（如 x86_64）
echo "src/gz myrepo https://github.com/${REPO}/releases/download/${TAG_NAME}/\$ARCH" >> /etc/opkg/customfeeds.conf
\`\`\`

3. 更新软件源并安装：
\`\`\`bash
opkg update
opkg install luci-app-gecoosac
\`\`\`

### 方法二：手动安装
1. 从 Release 页面下载对应架构目录下的 .ipk 文件
2. 通过 SSH 上传到路由器
3. 安装：
\`\`\`bash
opkg install /path/to/luci-app-gecoosac_*.ipk
\`\`\`

## 常见问题
### 1. 如何确定路由器的架构？
\`\`\`bash
opkg print-architecture
\`\`\`

### 2. 如果遇到证书错误
\`\`\`bash
opkg install ca-bundle
\`\`\`

### 3. 如果无法访问 GitHub
如果路由器无法访问 GitHub，可以尝试：
1. 使用代理
2. 将文件下载到本地，然后上传到路由器安装

### 4. 更新软件
\`\`\`bash
opkg update
opkg upgrade luci-app-gecoosac
\`\`\`

## 开发说明
本仓库使用 GitHub Actions 自动构建，当推送标签（如 v1.0.0）时会自动触发构建。

## 许可证
本软件包基于相应开源许可证发布。
EOF
          
          # 生成安装脚本（修复源URL）
          cat > instructions/INSTALL.sh << EOF
#!/bin/sh
# OpenWrt 安装脚本
set -e

echo "正在设置 OpenWrt 软件源..."

# 获取路由器架构
ARCH=\$(opkg print-architecture | grep 'arch' | awk '{print \$2}')
if [ -z "\$ARCH" ]; then
  echo "错误：无法检测路由器架构"
  exit 1
fi
echo "检测到路由器架构：\$ARCH"

# 添加软件源
FEED_FILE="/etc/opkg/customfeeds.conf"
FEED_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/\$ARCH"

echo "添加软件源: \${FEED_URL}"
echo "src/gz custom \${FEED_URL}" >> "\${FEED_FILE}"

# 更新并安装
echo "更新软件源..."
opkg update

echo "安装 luci-app-gecoosac..."
opkg install luci-app-gecoosac

echo "安装完成！"
EOF
          
          chmod +x instructions/INSTALL.sh
          echo "使用说明已生成"

      - name: Upload instructions to Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name || 'Manual Build' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: false
          artifacts: instructions/*
          tag: ${{ github.ref_name || 'manual-build' }}
          omitBodyDuringUpdate: true

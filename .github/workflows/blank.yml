name: Build OpenWrt Packages

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      arch:
        description: '指定要编译的架构（留空则编译所有架构）'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_arm1176jzf-s_vfp
          - arm_arm926ej-s
          - arm_cortex-a15_neon-vfpv4
          - arm_cortex-a5_vfpv4
          - arm_cortex-a7
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a8_vfpv3
          - arm_cortex-a9
          - arm_cortex-a9_neon
          - arm_cortex-a9_vfpv3-d16
          - arm_fa526
          - arm_xscale
          - i386_pentium-mmx
          - i386_pentium4
          - mips64_octeonplus
          - mips_24kc
          - mips_4kec
          - mips_mips32
          - mipsel_24kc_24kf
          - mipsel_74kc
          - mipsel_mips32
          - x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: sbwml/openwrt-gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-gecoosac
          NO_REFRESH_CHECK: true

      - name: Generate Packages index
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        run: |
          cd bin/packages/${{ matrix.arch }}/packages_ci
          
          # 创建Python脚本生成索引
          cat > generate_packages.py << 'EOF'
import os
import gzip
import hashlib
import sys

def generate_packages_index():
    packages = []
    
    for filename in os.listdir('.'):
        if not filename.endswith('.ipk'):
            continue
        
        # 计算文件哈希
        with open(filename, 'rb') as f:
            content = f.read()
            file_size = len(content)
            md5_hash = hashlib.md5(content).hexdigest()
            sha256_hash = hashlib.sha256(content).hexdigest()
        
        # 解析包名
        basename = filename[:-4]  # 移除 .ipk
        parts = basename.split('_')
        
        # 尝试解析包信息
        if len(parts) >= 3:
            # 假设格式为: name_version_architecture.ipk
            package_name = '_'.join(parts[:-2])
            version = parts[-2]
            architecture = parts[-1]
        else:
            # 如果解析失败，使用默认值
            package_name = basename
            version = '1.0-1'
            architecture = '${{ matrix.arch }}'.split('_')[0] if '_' in '${{ matrix.arch }}' else '${{ matrix.arch }}'
        
        # GitHub Release下载URL
        release_name = '${{ github.ref_name }}'
        repo_owner = '${{ github.repository_owner }}'
        repo_name = '${{ github.event.repository.name }}'
        
        if release_name:
            download_url = f"https://github.com/{repo_owner}/{repo_name}/releases/download/{release_name}/{filename}"
        else:
            # 对于手动构建，没有标签
            download_url = f"https://github.com/{repo_owner}/{repo_name}/releases/latest/download/{filename}"
        
        # 构建包信息
        package_info = f"""Package: {package_name}
Version: {version}
Depends: libc
Source: {repo_name}
SourceName: {package_name}
Section: luci
Architecture: {architecture}
Installed-Size: {file_size}
Filename: {filename}
Size: {file_size}
MD5Sum: {md5_hash}
SHA256sum: {sha256_hash}
Description: {package_name} - OpenWrt package
License: Unknown
Maintainer: Auto Build <auto@build.com>

"""
        packages.append(package_info)
    
    # 写入Packages文件
    with open('Packages', 'w') as f:
        for pkg in packages:
            f.write(pkg)
    
    # 创建压缩版本
    with open('Packages', 'rb') as f_in:
        with gzip.open('Packages.gz', 'wb', compresslevel=9) as f_out:
            f_out.write(f_in.read())
    
    print(f"Generated Packages index with {len(packages)} packages")

if __name__ == '__main__':
    generate_packages_index()
EOF

          python3 generate_packages.py
          
          # 验证生成的文件
          echo "=== 生成的文件列表 ==="
          ls -la
          echo ""
          echo "=== Packages文件前10行 ==="
          head -20 Packages || true

      - name: Upload to artifacts
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/packages_ci/
          retention-days: 7

      - name: Upload to GitHub Release
        if: ${{ github.event.inputs.arch == '' || matrix.arch == github.event.inputs.arch }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          files: |
            bin/packages/${{ matrix.arch }}/packages_ci/*.ipk
            bin/packages/${{ matrix.arch }}/packages_ci/Packages
            bin/packages/${{ matrix.arch }}/packages_ci/Packages.gz
          draft: false
          prerelease: false
          generate_release_notes: true

  create-instructions:
    name: Create Usage Instructions
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Generate usage instructions
        run: |
          mkdir -p instructions
          
          cat > instructions/README.md << 'EOF'
# OpenWrt 软件包仓库

本仓库提供 OpenWrt 软件包的自动构建和发布。

## 支持的架构

${{ join(fromJSON('["aarch64_cortex-a53", "aarch64_cortex-a72", "aarch64_generic", "arm_arm1176jzf-s_vfp", "arm_arm926ej-s", "arm_cortex-a15_neon-vfpv4", "arm_cortex-a5_vfpv4", "arm_cortex-a7", "arm_cortex-a7_neon-vfpv4", "arm_cortex-a8_vfpv3", "arm_cortex-a9", "arm_cortex-a9_neon", "arm_cortex-a9_vfpv3-d16", "arm_fa526", "arm_xscale", "i386_pentium-mmx", "i386_pentium4", "mips64_octeonplus", "mips_24kc", "mips_4kec", "mips_mips32", "mipsel_24kc_24kf", "mipsel_74kc", "mipsel_mips32", "x86_64"]'), '、') }}

## 使用方法

### 方法一：通过 opkg 源安装（推荐）

1. 在 OpenWrt 路由器上编辑 opkg 配置文件：

```bash
# 添加软件源（将下面的URL替换为实际地址）
echo "src/gz myrepo https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name || 'latest' }}" >> /etc/opkg/customfeeds.conf

# 或者按架构添加
# echo "src/gz myrepo https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name || 'latest' }}/bin/packages/<你的架构>/packages_ci" >> /etc/opkg/customfeeds.conf
